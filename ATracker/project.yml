# Genera ATracker.xcodeproj con XcodeGen (https://github.com/yonaskolb/XcodeGen):
#   cd ATracker && xcodegen && open ATracker.xcodeproj
# Después solo hay que elegir tu equipo en Signing & Capabilities (los dos targets).
name: ATracker
options:
  bundleIdPrefix: com.ahcamarasa
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
targets:
  ATracker:
    type: application
    platform: iOS
    sources: [iOS, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ahcamarasa.atracker
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_CFBundleDisplayName: ATracker
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    dependencies:
      - target: ATrackerWatch
        embed: true
        codeSign: false
        copy:
          destination: productsDirectory
          subpath: $(CONTENTS_FOLDER_PATH)/Watch
  ATrackerWatch:
    type: application
    platform: watchOS
    sources: [Watch, Shared]
    settings:
      base:
        PRODUCT_NAME: ATracker Watch
        PRODUCT_BUNDLE_IDENTIFIER: com.ahcamarasa.atracker.watchkitapp
        SKIP_INSTALL: YES
        INFOPLIST_KEY_CFBundleDisplayName: ATracker
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.ahcamarasa.atracker
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: NO
